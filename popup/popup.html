<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>YouTube Full Captions</h1>
    <label class="row">
      <input type="checkbox" id="enabled" />
      <span>Show auto-captions line by line</span>
    </label>
    <label class="row">
      <span>Lines per caption</span>
      <select id="linesPerCaption">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>
    <p class="hint">Changes apply the next time captions load. Toggle captions off and on (C), or reload the page.</p>
    <script src="popup.js"></script>
  </body>
</html>
