<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>YT Full Captions</h1>
    <label class="row">
      <input type="checkbox" id="enabled" />
      <span>Vis auto-tekst linje for linje</span>
    </label>
    <label class="row">
      <span>Linjer per tekst</span>
      <select id="linesPerCaption">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>
    <p class="hint">Endringer gjelder neste gang tekstingen lastes. Slå tekstingen av og på (C), eller last siden på nytt.</p>
    <script src="popup.js"></script>
  </body>
</html>
